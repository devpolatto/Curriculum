cv:
  name: Angelo Polatto
  headline: DevOps Engineer | Cloud Platform
  location: Recife, PE, Brazil
  email: polatto.xcode.job@gmail.com
  phone: +55 81 99976-6539
  website: https://inthemind.polatto.dev.br/
  social_networks:
    - network: LinkedIn
      username: angelopolatto
    - network: GitHub
      username: devpolatto
  sections:
    About me:
      - DevOps / Cloud Platform Engineer with multi-cloud experience (OCI, AWS, and Azure), infrastructure as code, and GitOps.
      - HashiCorp Terraform Associate and AWS Certified Solutions Architect Associate.
      - Running multi-tenant Kubernetes platforms in production — ArgoCD, Helm, CI/CD, secrets management, and incident response.
      - Strong networking and edge security background — site-to-site IPSec VPN, FortiWeb WAF, and the Fortinet ecosystem.
      - Observability with Elastic, Grafana, Prometheus, and Dynatrace; data pipelines with Kinesis, Databricks, EMR, and Spark.
      - Measurement-driven root cause analysis, with reproducible documentation in runbooks and postmortems.
    Education:
      - institution: UNIBRA - Centro Universitário Brasileiro
        area: Computer Networks Technologist
        degree: TEC
        grade:
        date:
        start_date: 2018-02
        end_date: 2021-12
        location: Recife, PE, Brazil
        summary: Network Architecture, Information Security, Linux Systems Administration.
    Experience:
      - company: Equanimüs (GovONE)
        position: DevOps Engineer
        date:
        start_date: 2026-07
        end_date: present
        location: Remote
        summary: DevOps / Cloud Platform engineering for a multi-tenant digital government SaaS platform on Kubernetes (OKE/OCI), serving municipalities in Brazil and a digital identity project in Mozambique.
        highlights:
          - Split monolithic Terraform (staging and production, ~57 resources each) into 6 domain projects, adopting live infrastructure via import; caught 2 destructive plans before apply and built reusable VPN and egress gateway modules.
          - Led the infrastructure side of migrating managed PostgreSQL from OCI to an on-premise data center in Mozambique — requirements, IPSec VPN, initial load, and 24h latency measurement (p95 RTT of 10.7 ms).
          - Consolidated staging and production FortiWeb WAFs into a single appliance (~5 s cutover per environment, TLS 1.0/1.1 disabled) and handled signature false positives with host- and path-scoped exceptions.
          - Site-to-site IPSec VPNs with international partners and an SNAT egress gateway.
          - External Secrets + OCI Vault with Workload Identity across 3 clusters, eliminating exposed private keys.
          - GitOps with ArgoCD, Helmfile, and GitLab CI — restored sync for 151 applications in ~3 min and cut a Python API build time by 51%.
          - Production RCA (Node.js OOM, health probes, HPA, TLS), documented in 40 runbooks and 6 postmortems.
      - company: Acqio
        position: DevOps Engineer
        date:
        start_date: 2025-03
        end_date: 2026-05
        location: Recife, PE, Brazil
        summary: Responsible for automation, observability, and reliability of cloud environments at scale, with focus on infrastructure as code and CI/CD.
        highlights:
          - Infrastructure as code implementation with Terraform, AWS CDK, AWS SDK, and Azure SDK.
          - Development and maintenance of observability systems with Elasticsearch, Kibana, and Grafana.
          - Building and evolving CI/CD pipelines using Azure DevOps.
          - Orchestration of cloud-native applications with Kubernetes and Helm, ensuring high availability and scalability.
          - Rightsized Kubernetes workloads using consumption dashboards — requests/limits tuning and autoscaling — enabling smaller cluster nodes with no performance impact.
          - Automated off-hours shutdown of dev/staging/prod resources with an Azure Function, reducing monthly operating costs.
          - Automation of deployment and configuration processes with Bash and Python.
          - Participation in agile practices, contributing to technical priority definition and team alignment.
      - company: Acqio
        position: NOC Analyst
        date:
        start_date: 2023-08
        end_date: 2025-05
        location: Recife, PE, Brazil
        summary: Focused on monitoring, automation, observability, and operational efficiency in payment architectures.
        highlights:
          - Implementation of monitoring and alerting with Elasticsearch, Kibana, and Grafana, increasing visibility and incident response.
          - Data analysis with Python and Apache Spark for operational insights generation.
          - AWS and Azure infrastructure provisioning and management using Terraform and Azure SDK.
          - Automation of pipelines and operational routines with Bash and Python.
          - Work with Kubernetes and Helm for containerized application orchestration, ensuring scalability and resilience.
          - Azure DevOps usage in CI/CD pipelines and active participation in Scrum ceremonies.
      - company: Vectra c&s
        position: Network Management Technician
        date:
        start_date: 2021-11
        end_date: 2023-08
        location: Recife, PE, Brazil
        summary:
        highlights:
          - Data Center network monitoring NOC (Zabbix, Grafana, Spectrum)
          - Security monitoring SOC (Elastic SIEM)
          - Fortinet assets setup and support (Fortigate, FortiAnalyzer, FortiManager)
    Skills:
      - label: Cloud & Infrastructure
        details: Oracle Cloud (OCI — OKE, Vault, DRG, Object Storage), AWS, Microsoft Azure, Linux server administration, on-premise infrastructure, Event-Driven Architecture, FinOps (rightsizing and cost optimization).

      - label: Infrastructure as Code (IaC)
        details: Terraform (reusable modules, import, and state refactoring), AWS CDK (TypeScript), CloudFormation, Ansible, Azure SDK

      - label: Containers & Orchestration
        details: Kubernetes (OKE, AKS, EKS), Helm, Helmfile, Docker, Service Mesh (Istio), high availability, HPA, health probes, and troubleshooting in Kubernetes clusters

      - label: CI/CD & GitOps
        details: GitLab CI, Azure DevOps, ArgoCD, GitOps, registries (Harbor, OCIR), deployment automation, Bash

      - label: Security & Secrets
        details: External Secrets Operator, OCI Vault, Workload Identity, least-privilege RBAC, FortiWeb WAF, Fortinet (FortiGate, FortiAnalyzer, FortiManager), TLS

      - label: Programming & Automation
        details: Python, TypeScript, Bash, AWS Lambda, task automation, and script development

      - label: Observability, Monitoring & Reliability
        details: Dynatrace, Elasticsearch, Logstash, Kibana, Grafana, Prometheus, Zabbix, Elastic APM, metrics, logs, and tracing, SLAs and SLOs

      - label: Data & Messaging
        details: MongoDB, RDS, Cassandra, PostgreSQL, Redis, Kafka (AWS MSK), SQS, EMR, Kinesis, S3, Spark, Hadoop

      - label: Operating Systems & Networking
        details: Linux, site-to-site IPSec VPN, SNAT and egress gateway, HAProxy, NGINX (reverse proxy), DNS, SSH, vulnerability analysis

      - label: Agile Methodologies & Collaboration
        details: Scrum (Daily, Sprint Planning), technical alignment, prioritization, and collaboration between teams
    Certificates:
      - title: Terraform Associate (003)
        authors:
          - HashiCorp
        journal:
        date:
        start_date: 2025-06
        end_date: 2027-06
      - title: AWS Certified Solutions Architect – Associate
        authors:
          - Amazon Web Services (AWS)
        journal:
        date:
        start_date: 2024-12
        end_date: 2027-12
      - title: AWS Certified Cloud Practitioner
        authors:
          - Amazon Web Services (AWS)
        journal:
        date:
        start_date: 2022-06
        end_date: 2025-07
      - title: NSE 4 Network Security Professional
        authors:
          - Fortinet
        journal:
        date:
        start_date: 2023-03
        end_date: 2025-03
