cv:
  name: Angelo Polatto
  headline: DevOps Enginnering
  location: Recife, PE, Brazil
  email: polatto.xcode.job@gmail.com
  phone: +55 81 99976-6539
  website: https://inthemind.polatto.dev.br/
  social_networks:
    - network: LinkedIn
      username: angelopolatto
    - network: GitHub
      username: devpolatto
  custom_connections:
  sections:
    Sobre mim:
      - DevOps e Arquiteto Cloud com foco em AWS e Azure, automação e infraestrutura como código.
      - Certificado AWS Solutions Architect Associate, atuando com CI/CD, AWS CDK, TypeScript e Python.
      - Experiência em ambientes cloud-native, observabilidade, microsserviços, Kubernetes e soluções serverless.
      - Vivência multi-cloud (AWS, Azure) e administração de ambientes Linux em produção.
      - Expertise em pipelines de dados com ETL, processamento em larga escala utilizando Kinesis, DataBricks, EMR e Spark.
      - Focado em arquiteturas escaláveis, resilientes e orientadas a boas práticas de software.
    Formação:
      - institution: UNIBRA - Centro Universitário Brasileiro
        area: Técnologo em Redes de Computadores
        degree: TEC
        grade:
        date:
        start_date: 2018-02
        end_date: 2021-12
        location: Recife, PE, Brazil
        summary: Arquitetura de Redes, Segurança da Informação, Administração de Sistemas Linux.
    experiência:
      - company: Acqio
        position: DevOps Engineer
        date:
        start_date: 2025-03
        end_date: 2026-05
        location: Recife, PE, Brazil
        summary: Responsável por automação, observabilidade e confiabilidade de ambientes cloud em escala, com foco em infraestrutura como código e CI/CD.
        highlights:
          - Implementação de infraestrutura como código com Terraform, AWS CDK, AWS SDK e Azure SDK.
          - Desenvolvimento e manutenção de sistemas de observabilidade com Elasticsearch, Kibana e Grafana.
          - Construção e evolução de pipelines CI/CD utilizando Azure DevOps.
          - Orquestração de aplicações cloud-native com Kubernetes e Helm, garantindo alta disponibilidade e escalabilidade.
          - Automação de processos de deployment e configuração com Bash, Python.
          - Atuação em práticas ágeis, contribuindo para definição de prioridades técnicas e alinhamento do time.
      - company: Acqio
        position: NOC Analyst
        date:
        start_date: 2023-08
        end_date: 2025-05
        location: Recife, PE, Brazil
        summary: Atuação focada em monitoramento, automação, observabilidade e eficiência operacional em arquiteturas de pagamentos.
        highlights:
          - Implementação de monitoramento e alertas com Elasticsearch, Kibana e Grafana, aumentando a visibilidade e a resposta a incidentes.
          - Análise de dados com Python e Apache Spark para geração de insights operacionais.
          - Provisionamento e gerenciamento de infraestrutura AWS e Azure utilizando Terraform e Azure SDK.
          - Automação de pipelines e rotinas operacionais com Bash, Python.
          - Atuação com Kubernetes e Helm para orquestração de aplicações containerizadas, garantindo escalabilidade e resiliência.
          - Uso de Azure DevOps em pipelines CI/CD e participação ativa em cerimônias Scrum.
      - company: Vectra c&s
        position: Técnico de Gerenciamento de Redes
        date:
        start_date: 2021-11
        end_date: 2023-08
        location: Recife, PE, Brazil
        summary:
        highlights:
          - Monitoramento de redes de Data Centers NOC(Zabbix, Grafana, Spectrum)
          - Monitoramento de segurança SOC(Elastic SIEM)
          - Setup e suporte de ativos da Fortinet(Fortigate, FortiAnalyzer, FortiManager)
    Habilidades:
      - label: Cloud & Infraestrutura
        details: AWS, Microsoft Azure, Administração de servidores Linux, Infrastructure on-premise, Event-Driven Architecture.

      - label: Infraestrutura como Código (IaC)
        details: Terraform, AWS CDK (TypeScript), CloudFormation, Ansible, Azure SDK, provisionamento declarativo, versionado e automatizado de infraestrutura

      - label: Containers & Orquestração
        details: Kubernetes (AKS, EKS), Helm, Docker, Service Mesh (Istio), orquestração de aplicações, alta disponibilidade e resiliência, Networking, segurança e troubleshooting em clusters Kubernetes

      - label: CI/CD & Automação
        details: Azure DevOps, CI/CD pipelines, automação de deploys, workflows de entrega contínua, Bash

      - label: Programação & Automação
        details: Python, TypeScript, Bash, AWS Lambda, automação de tarefas e desenvolvimento de scripts

      - label: Observabilidade, Monitoramento & Confiabilidade
        details: Elasticsearch, Logstash, Kibana, Grafana, Prometheus, Elastic APM, métricas, logs e tracing, SLAs e SLOs

      - label: Dados & Mensageria
        details: MongoDB, RDS, Cassandra, PostgreSQL, Redis, Kafka (AWS MSK), SQS, EMR, Kinesis, S3, Spark, Hadoop

      - label: Sistemas Operacionais & Redes
        details: Linux, NGINX (proxy reverso), redes, SSH, DNS, segurança e análise de vulnerabilidades

      - label: Metodologias Ágeis & Colaboração
        details: Scrum (Daily, Sprint Planning), alinhamento técnico, priorização e colaboração entre times
    Certificados:
      - title: Terraform Associate (003)
        authors:
          - HashiCorp
        journal:
        date:
        start_date: 2025-06
        end_date: 2027-06
      - title: AWS Certified Solutions Architect – Associate
        authors:
          - Amazon Web Services (AWS)
        journal:
        date:
        start_date: 2024-12
        end_date: 2027-12
      - title: AWS Certified Cloud Practitioner
        authors:
          - Amazon Web Services (AWS)
        journal:
        date:
        start_date: 2022-06
        end_date: 2025-07
      - title: NSE 4 Network Security Professional
        authors:
          - Fortinet
        journal:
        date:
        start_date: 2023-03
        end_date: 2025-03
