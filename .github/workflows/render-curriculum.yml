# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Render CV

on:
  push:
    branches:
      - master
    paths:
      - "Angelo_Polatto_PT-BR_CV.yaml"
      - "Angelo_Polatto_EN-US_CV.yaml"
      - ".github/workflows/render-curriculum.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: ".python-version"

      - name: Install UV
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install RenderCV with UV
        run: |
          uv sync --locked

      - name: Render CV
        run: |
          ./render-cv.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-output
          path: rendercv_output/Angelo_Polatto_*.pdf
          retention-days: 30

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          git tag -f latest
          git push -f origin latest
          gh release create latest rendercv_output/Angelo_Polatto_*.pdf \
            --title "Latest CV" \
            --notes "Generated on $(date -u '+%Y-%m-%d %H:%M UTC') from commit ${{ github.sha }}"
